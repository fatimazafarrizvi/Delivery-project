name: eval

on:
  push:
  pull_request:

jobs:
  eval-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run eval harness
        env:
          SUPPORT_AI_USE_LLM: "0"
        run: python -m support_ai eval
